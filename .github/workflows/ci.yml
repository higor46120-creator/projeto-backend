name: CI Backend Helptech

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e rodar os testes unitários
        run: ./mvnw clean verify

 docker-build:
    runs-on: ubuntu-latest
    needs: build-maven
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Artefato JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da Imagem Docker
        run: docker build -t manupred_be .

      - name: Tag e Push da Imagem
        run: |
          docker tag manupred_be ${{ secrets.DOCKER_USERNAME }}/manupred_be:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/manupred_be:latest
  deploy-kubernetes:
    runs-on: self-hosted
    needs: docker-build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Aplicar deployment no Kubernetes
        run: kubectl apply -f deployment.yaml
