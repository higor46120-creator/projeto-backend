
name: CI/CD Backend HelpTech

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      deploy:
        description: "Fazer deploy no Kubernetes AWS EKS?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  # ============================================
  # 1. COMPILAR E TESTAR O BACKEND
  # ============================================
  build-and-test:
    name: Build e testes Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permissão do Maven Wrapper
        run: chmod +x mvnw

      - name: Validar Java
        run: java -version

      - name: Compilar e executar testes
        run: ./mvnw --batch-mode clean verify

      - name: Salvar artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: helptech-backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # 2. CONSTRUIR E PUBLICAR IMAGEM DOCKER
  # ============================================
  docker-build:
    runs-on: ubuntu-latest
    needs:  build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Artefato JAR
        uses: actions/download-artifact@v4
        with:
          name: helptech-backend-jar
          path: target/

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da Imagem Docker
        run: docker build -t kipper_be .

      - name: Tag e Push da Imagem
        run: |
          docker tag kipper_be ${{ secrets.DOCKER_USERNAME }}/kipper_be:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/kipper_be:latest

  # ============================================
  # 3. DEPLOY MANUAL NA AWS EKS
  # ============================================
  deploy-kubernetes:
    name: Deploy AWS EKS
    runs-on: ubuntu-latest
    needs: docker-build

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true

    permissions:
      contents: read
      id-token: write

    environment: production

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configurar acesso ao EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name helptech-eks

      - name: Verificar namespace
        run: kubectl get namespace helptech

      - name: Verificar deployment existente
        run: |
          kubectl get deployment backend-deployment \
            -n helptech

      - name: Atualizar imagem do backend
        run: |
          kubectl set image deployment/backend-deployment \
            backend-container=${{ secrets.DOCKER_USERNAME }}/helptec_be:${{ github.sha }} \
            -n helptech

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/backend-deployment \
            -n helptech \
            --timeout=300s

      - name: Verificar pods
        run: |
          kubectl get pods -n helptech
          kubectl get deployments -n helptech
