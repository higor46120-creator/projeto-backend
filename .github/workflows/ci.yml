name: CI Backend Helptech

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Token do SonarCloud (GitHub > Settings > Secrets and variables > Actions > SONAR_TOKEN)
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: o SonarCloud usa para saber o que é "código novo"

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e rodar os testes unitários
        run: ./mvnw clean verify

      - name: Cache do SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Só roda depois que o SONAR_TOKEN for cadastrado (sem ele o CI continua passando)
      - name: Análise no SonarCloud (com cobertura dos testes)
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/helptech-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/helptech-backend:${{ github.sha }}
  deploy-kubernetes:
    runs-on: self-hosted
    needs: docker-build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Aplicar deployment no Kubernetes
        run: kubectl apply -f deployment.yaml
