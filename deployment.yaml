apiVersion: v1
kind: ConfigMap
metadata:
  name: helptech-config
data:
  DB_PROJECT_NAME: "helptec"
  DB_HOST: "host.minikube.internal"
  DB_PORT: "3310"
  DB_NAME: "helptec"
  DB_USER: "root"
  # Troque pelo bucket do seu projeto (Firebase Console > Storage)
  FIREBASE_STORAGE_BUCKET: "SEU-PROJETO.firebasestorage.app"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helptech-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: helptech-backend

  template:
    metadata:
      labels:
        app: helptech-backend

    spec:
      containers:
        - name: helptech-backend
          image: higorsantanafiec/helptech-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: helptech-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helptech-db-secret
                  key: DB_PASSWORD

            # Chave do JWT (Base64). Sem ela, os tokens param de valer a cada reinício do pod.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: helptech-jwt-secret
                  key: JWT_SECRET

            # Login com Google (obrigatórios: sem eles a aplicação não sobe)
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: helptech-google-oauth
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: helptech-google-oauth
                  key: GOOGLE_CLIENT_SECRET

            # Firebase: lido do arquivo montado pelo volume abaixo
            - name: FIREBASE_CONFIG_FILE
              value: /etc/firebase/serviceAccountKey.json

          volumeMounts:
            - name: firebase-credentials
              mountPath: /etc/firebase
              readOnly: true

      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-service-account

---
apiVersion: v1
kind: Service
metadata:
  name: helptech-backend-service

spec:
  type: NodePort

  selector:
    app: helptech-backend

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helptech-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: helptech-frontend

  template:
    metadata:
      labels:
        app: helptech-frontend

    spec:
      containers:
        - name: helptech-frontend
          image: higorsantanafiec/helptech-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: helptech-frontend-service

spec:
  type: NodePort

  selector:
    app: helptech-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081
