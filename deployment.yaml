apiVersion: v1
kind: ConfigMap
metadata:
  name: helptech-config
data:
  DB_PROJECT_NAME: "helptec"
  # Nome do banco dentro do cluster MongoDB Atlas
  MONGODB_DATABASE: "helptec"
  # Endereço do site (front) que pode chamar a API. TROQUE pelo domínio de vocês.
  CORS_ALLOWED_ORIGINS: "https://helptec.SEU-DOMINIO"
  # AWS: região e bucket dos anexos
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "fiec-tcc-helptec"
  # Troque pelo bucket do seu projeto (Firebase Console > Storage)
  FIREBASE_STORAGE_BUCKET: "SEU-PROJETO.firebasestorage.app"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helptech-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: helptech-backend

  template:
    metadata:
      labels:
        app: helptech-backend

    spec:
      containers:
        - name: helptech-backend
          image: higorsantanafiec/helptech-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: helptech-config

          env:
            # String de conexão do MongoDB Atlas (contém usuário e senha)
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: helptech-mongodb
                  key: MONGODB_URI

            # Chave do JWT (Base64). Sem ela, os tokens param de valer a cada reinício do pod.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: helptech-jwt-secret
                  key: JWT_SECRET

            # Login com Google (obrigatórios: sem eles a aplicação não sobe)
            # Chaves da AWS (Secret criado à parte; optional: sem ele o back sobe)
            #   kubectl create secret generic helptech-aws-secret \
            #     --from-literal=AWS_ACCESS_KEY_ID='...' --from-literal=AWS_SECRET_ACCESS_KEY='...'
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: helptech-aws-secret
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: helptech-aws-secret
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true

            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: helptech-google-oauth
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: helptech-google-oauth
                  key: GOOGLE_CLIENT_SECRET

            # Firebase: lido do arquivo montado pelo volume abaixo
            - name: FIREBASE_CONFIG_FILE
              value: /etc/firebase/serviceAccountKey.json

          volumeMounts:
            - name: firebase-credentials
              mountPath: /etc/firebase
              readOnly: true

      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-service-account

---
apiVersion: v1
kind: Service
metadata:
  name: helptech-backend-service

spec:
  type: NodePort

  selector:
    app: helptech-backend

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helptech-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: helptech-frontend

  template:
    metadata:
      labels:
        app: helptech-frontend

    spec:
      containers:
        - name: helptech-frontend
          image: higorsantanafiec/helptech-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: helptech-frontend-service

spec:
  type: NodePort

  selector:
    app: helptech-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081

---
# Entrada pelo domínio com https (o Google só aceita https ou localhost).
# No minikube, ative antes:  minikube addons enable ingress
# Certificado:  kubectl create secret tls helptech-tls --cert=certificado.crt --key=chave.key
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helptech-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - helptec.SEU-DOMINIO       # TROQUE
        - api.helptec.SEU-DOMINIO   # TROQUE
      secretName: helptech-tls
  rules:
    - host: helptec.SEU-DOMINIO     # TROQUE
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helptech-frontend-service
                port:
                  number: 80
    - host: api.helptec.SEU-DOMINIO # TROQUE
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helptech-backend-service
                port:
                  number: 8080
