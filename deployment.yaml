apiVersion: v1
kind: ConfigMap
metadata:
  name: helptech-config
data:
  DB_PROJECT_NAME: "helptec"
  DB_HOST: "host.minikube.internal"
  DB_PORT: "3310"
  DB_NAME: "helptec"
  DB_USER: "root"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helptech-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: helptech-backend

  template:
    metadata:
      labels:
        app: helptech-backend

    spec:
      containers:
        - name: helptech-backend
          image: higorsantanafiec/helptech-backend:latest
          imagePullPolicy: Always

          args:
            - "--app.firebase.config-file=/etc/firebase/serviceAccountKey.json"

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: helptech-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helptech-db-secret
                  key: DB_PASSWORD


            - name: FIREBASE_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: firebase-service-account
                  key: serviceAccountKey.json

 

      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-service-account

---
apiVersion: v1
kind: Service
metadata:
  name: helptech-backend-service

spec:
  type: NodePort

  selector:
    app: helptech-backend

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helptech-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: helptech-frontend

  template:
    metadata:
      labels:
        app: helptech-frontend

    spec:
      containers:
        - name: helptech-frontend
          image: higorsantanafiec/helptech-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: helptech-frontend-service

spec:
  type: NodePort

  selector:
    app: helptech-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081
