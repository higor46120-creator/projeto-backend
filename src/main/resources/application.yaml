spring:
  application:
    name: ${DB_PROJECT_NAME:helptec}

  # Lê variáveis de um arquivo .env na raiz do projeto, se existir (não vai para o Git).
  # Modelo: .env.example. Variáveis de ambiente do sistema continuam valendo.
  config:
    import: optional:file:.env[.properties]

  main:
    allow-bean-definition-overriding: true

  # ===== MongoDB =====
  # Sem MONGODB_URI usa o MongoDB local (localhost:27017). Ver perfis "local" e "professor".
  # A string de conexão (com usuário e senha) vem SÓ da variável de ambiente MONGODB_URI.
  # Nunca coloque a senha aqui: este repositório é público.
  # Formato: mongodb+srv://<usuario>:<senha>@<cluster>/?retryWrites=true&w=majority
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: ${MONGODB_DATABASE:helptec}
    representation:
      uuid: standard               # UUIDs dos usuários gravados no formato padrão (binário subtipo 4)

  data:
    mongodb:
      auto-index-creation: true    # cria os índices únicos (e-mail do usuário, nome da skill, etc.)

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  oauth2:
    redirect-uri: ${FRONTEND_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  firebase:
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    config-file: ${FIREBASE_CONFIG_FILE:}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:}
  google:
      extra-client-ids: 801876311719-o76pql4jcc9uc5m58qtvp7m7dvq8g6ap.apps.googleusercontent.com

api:
  security:
    token:
      # Chave do JWT em Base64. Gerar com: openssl rand -base64 64
      secret: ${JWT_SECRET:}
