spring:
  application:
    name: ${DB_PROJECT_NAME:helptec}

  # Lê variáveis de um arquivo .env na raiz do projeto, se existir (não vai para o Git).
  # Modelo: .env.example. Variáveis de ambiente do sistema continuam valendo.
  config:
    import: optional:file:.env[.properties]

  main:
    allow-bean-definition-overriding: true

  # ===== MCP (Model Context Protocol) =====
  # Os métodos dos controllers anotados com @McpTool viram ferramentas para agentes de IA
  # no endpoint POST /mcp. O agente envia o mesmo JWT da API (Authorization: Bearer ...),
  # então valem as mesmas permissões (@PreAuthorize) do usuário dono do token.
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:true}
        name: helptec
        version: 1.0.0
        type: SYNC
        protocol: STATELESS   # sem sessão em memória: funciona com várias réplicas no Kubernetes
        instructions: >
          Sistema HelpTec de chamados de suporte de TI da FIEC. Fluxo: solicitante abre o chamado
          (AGUARDANDO_APROVACAO) -> aprovador aprova/reprova -> gerente faz a triagem ou o suporte
          inicia o atendimento (EM_ATENDIMENTO) -> suporte resolve (RESOLVIDO). Use meu_usuario
          para saber o perfil do token antes de agir.
        annotation-scanner:
          enabled: true

  # ===== MongoDB =====
  # Sem MONGODB_URI usa o MongoDB local (localhost:27017). Ver perfis "local" e "professor".
  # A string de conexão (com usuário e senha) vem SÓ da variável de ambiente MONGODB_URI.
  # Nunca coloque a senha aqui: este repositório é público.
  # Formato: mongodb+srv://<usuario>:<senha>@<cluster>/?retryWrites=true&w=majority
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: ${MONGODB_DATABASE:helptec}
    representation:
      uuid: standard               # UUIDs dos usuários gravados no formato padrão (binário subtipo 4)

  data:
    mongodb:
      auto-index-creation: true    # cria os índices únicos (e-mail do usuário, nome da skill, etc.)

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  # E-mail promovido a SUPER_ADMIN na subida (único que pode usar POST /usuarios/csv).
  # O usuário precisa já existir. Ex.: SUPER_ADMIN_EMAIL=matheus27547@fiec.edu.br
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:}
  oauth2:
    redirect-uri: ${FRONTEND_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  firebase:
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    config-file: ${FIREBASE_CONFIG_FILE:}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:}
  # Endereços do front que podem chamar a API (CORS), separados por vírgula. "*" = qualquer um
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  google:
      extra-client-ids: 801876311719-o76pql4jcc9uc5m58qtvp7m7dvq8g6ap.apps.googleusercontent.com

api:
  security:
    token:
      # Chave do JWT em Base64. Gerar com: openssl rand -base64 64
      secret: ${JWT_SECRET:}

# ===== AWS =====
# Os valores vêm de variáveis de ambiente (IntelliJ, ~/.aws, Kubernetes). NUNCA escreva as chaves aqui.
cloud:
  aws:
    region:
      static: ${AWS_REGION:us-east-1}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      session-token: ${AWS_SESSION_TOKEN:}   # só nas chaves temporárias da AWS Academy
    s3:
      bucket: ${AWS_S3_BUCKET:fiec-tcc-helptec}
      # true: anexos dos chamados vão para o S3; false: continuam no Firebase Storage
      enabled: ${AWS_S3_ENABLED:true}
